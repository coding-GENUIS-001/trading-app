<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trading Rates Viewer</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>💹 Trading Rates Viewer</h1>
            <p class="subtitle">Real-time Exchange Rates & Cryptocurrencies</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search trading pairs..." />
            </div>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="forex">Forex</button>
                <button class="filter-btn" data-filter="crypto">Crypto</button>
            </div>
            <button class="watchlist-btn" id="watchlistBtn">⭐ Watchlist</button>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Total Pairs</div>
                <div class="stat-value" id="totalPairs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Watchlist Items</div>
                <div class="stat-value" id="watchlistCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Updated</div>
                <div class="stat-value" id="lastUpdate">--:--:--</div>
            </div>
        </div>

        <div class="rates-grid" id="ratesGrid">
            <!-- Rate cards will be generated here -->
        </div>

        <div class="modal" id="watchlistModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>My Watchlist</h2>
                    <button class="close-btn" id="closeWatchlist">&times;</button>
                </div>
                <div class="modal-body" id="watchlistContent">
                    <!-- Watchlist items will appear here -->
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay"></div>

        <!-- Chart modal -->
        <div class="chart-modal" id="chartModal" style="display:none;">
            <div class="chart-content">
                <div class="chart-header">
                    <h3 id="chartTitle">Chart</h3>
                    <button id="closeChart">&times;</button>
                </div>
                <div id="tv_chart_container" style="width:100%;height:520px;"></div>
            </div>
        </div>

    </div>

    <!-- Load optional frontend helpers before app.js -->
    <script src="verify.js"></script>

    <script src="app.js"></script>

    <!-- TradingView lightweight widget library will be loaded dynamically by app.js when needed.
         For convenience, also include the loader here as fallback (this doesn't start a widget by itself). -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</body>
</html>
